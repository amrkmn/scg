name: Nightly Build

on:
  schedule:
    # Run at 2:00 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [amd64, 386, arm64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 'stable'
          cache: true

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Cache Zig build
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zig-shim-${{ hashFiles('shim/src/main.zig', 'shim/build.zig') }}
          restore-keys: |
            zig-shim-

      - name: Get version info
        id: version
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +%Y%m%d)
          VERSION="nightly-${DATE}-${SHORT_SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building nightly version: $VERSION"

      - name: Build shim
        run: make build-shim-${{ matrix.arch }}

      - name: Run tests
        run: make test

      - name: Build binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make build-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scg-${{ matrix.arch }}
          path: dist/scg-${{ matrix.arch }}.exe
          retention-days: 7

  release:
    needs: nightly
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: scg-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.exe > checksums.txt
          cat checksums.txt

      - name: Update nightly release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: Nightly Build
          tag_name: nightly
          files: dist/*
          draft: false
          prerelease: true
          body: |
            Automated nightly build from [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            **Version:** `${{ needs.nightly.outputs.version }}`

            ⚠️ Development build — may be unstable.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}