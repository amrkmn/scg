name: Nightly Build

on:
  schedule:
    # Run at 2:00 AM UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Base version for nightly builds; bump when scg's current stable version advances.
  NIGHTLY_BASE: v0.4.6

jobs:
  nightly:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [amd64, 386, arm64]
    outputs:
      version: ${{ steps.version.outputs.version }}
      branch: ${{ steps.version.outputs.branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "stable"
          cache: true

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Cache Zig build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .zig-cache
          key: zig-shim-${{ hashFiles('shim/src/main.zig', 'shim/build.zig') }}
          restore-keys: |
            zig-shim-

      - name: Get version info
        id: version
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +%Y%m%d)
          VERSION="${{ env.NIGHTLY_BASE }}-nightly.${DATE}.${SHORT_SHA}"
          BRANCH="$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Building nightly version: $VERSION"

      - name: Build and test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          powershell -NoProfile -File scripts/build.ps1 -Arch ${{ matrix.arch }} -Version $env:VERSION
          make test

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scg-${{ matrix.arch }}
          path: dist/scg-${{ matrix.arch }}.exe
          retention-days: 7

  release:
    needs: nightly
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: scg-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.exe > checksums.txt
          cat checksums.txt

      - name: Publish nightly release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          name: "Nightly ${{ needs.nightly.outputs.version }}"
          tag_name: ${{ needs.nightly.outputs.version }}
          files: dist/*
          draft: false
          prerelease: true
          make_latest: false
          body: |
            Automated nightly build from [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            **Version:** `${{ needs.nightly.outputs.version }}`

            ⚠️ Development build — may be unstable.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish nightly branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ needs.nightly.outputs.branch }}"
          cd dist
          git init -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "nightly build ${{ needs.nightly.outputs.version }}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BRANCH"
          echo "Published nightly branch: $BRANCH"

      - name: Prune old nightlies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep the 14 most recent nightly releases (each deleted together with its tag).
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.tag_name | test("-nightly\.")) | .tag_name' \
            | sort | tail -n +15 | while read -r tag; do
                gh release delete "$tag" --yes
              done
          # Keep the 14 most recent nightly branches.
          gh api "repos/${{ github.repository }}/git/matching-refs/heads/v" \
            --jq '.[].ref | select(test("-nightly\\."))' \
            | sort | tail -n +15 | while read -r ref; do
                branch="${ref#refs/heads/}"
                gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$branch" > /dev/null
              done
