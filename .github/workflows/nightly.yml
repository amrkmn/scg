name: Nightly Build

on:
  schedule:
    # Run at 2:00 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: windows-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Set up just
        uses: extractions/setup-just@v2
        with:
          just-version: '1'

      - name: Get version info
        id: version
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +%Y%m%d)
          VERSION="nightly-${DATE}-${SHORT_SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building nightly version: $VERSION"

      - name: Run tests
        run: just test

      - name: Build binary
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OUTPUT="dist/scg-${{ matrix.goarch }}.exe"
          go build -ldflags "-X main.Version=$VERSION -s -w" -o "$OUTPUT" ./cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scg-windows-${{ matrix.goarch }}
          path: dist/scg-${{ matrix.goarch }}.exe
          retention-days: 7

  release:
    needs: nightly
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: scg-windows-*
          merge-multiple: true

      - name: Update nightly release
        uses: softprops/action-gh-release@v1
        with:
          name: Nightly Build
          tag_name: nightly
          files: dist/*.exe
          draft: false
          prerelease: true
          body: |
            This is an automated nightly build.
            
            **Commit:** ${{ github.sha }}
            
            ⚠️ This is a development build and may be unstable.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}